spring:
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:mzc-gcp-managed}
      credentials:
        location: ${GCP_CREDENTIALS_LOCATION:classpath:gcp-credentials.json}
      bigquery:
        dataset: ${BIGQUERY_DATASET:infra_admin_dataset}
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    accesslog:
      enabled: true
      pattern: "%h %l %u %t \"%r\" %s %b %Dms"

logging:
  level:
    org.springframework.web: INFO
    com.example.infra: INFO

app:
  # @Scheduled 배치 실행 여부. 기본 꺼짐(로컬/테스트), 운영 Dockerfile에서 true
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:false}
  security:
    encryption-key: "MZC-INFRA-SECRET-KEY"
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  bq:
    # BigQuery 성능 보고서 수집 시 제외할 사내 계정 도메인 (수집 서비스 계정은 자격증명에서 자동 제외)
    exclude-email-domain: ${APP_BQ_EXCLUDE_EMAIL_DOMAIN:mz.co.kr}

jira:
  base-url: ${JIRA_BASE_URL:https://mzdevs.atlassian.net}
  user-email: ${JIRA_USER_EMAIL:michael@mz.co.kr}
  api-token: ${JIRA_API_TOKEN:YOUR_JIRA_API_TOKEN}
